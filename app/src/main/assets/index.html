<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#102e35">
  <title>Río Aventura</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #102e35; font-family: system-ui, sans-serif; color: white; }
    body { display: grid; place-items: center; }
    #stage { position: relative; width: min(100vw, 56.25vh); height: min(100vh, 177.78vw); max-width: 540px; overflow: hidden; background: #58b8c5; box-shadow: 0 0 50px #071f29; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; pointer-events: none; font-weight: 800; text-shadow: 0 2px 8px #153a49; }
    #hud span { padding: 8px 12px; border-radius: 16px; background: #0d3749aa; }
    #pause { pointer-events: auto; border: 0; width: 42px; height: 42px; border-radius: 14px; background: #0d3749cc; color: white; font-size: 20px; }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 26px; background: linear-gradient(#0b2837cb, #0b2837ed); }
    #overlay.hidden { display: none; }
    #overlay h1 { margin: 0; font-size: clamp(38px, 10vw, 58px); line-height: 1; }
    #overlay p { max-width: 280px; font-size: 17px; line-height: 1.45; color: #d8f8f6; }
    #play { margin-top: 14px; padding: 16px 32px; border: 0; border-radius: 16px; background: #ffdd79; color: #18353a; font: 800 19px system-ui, sans-serif; box-shadow: 0 8px 0 #c89e42; }
    #play:active { transform: translateY(5px); box-shadow: 0 3px 0 #c89e42; }
    #hint { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 14px; font-weight: 700; color: #efffff; text-shadow: 0 2px 8px #153a49; pointer-events: none; }
  </style>
</head>
<body>
  <main id="stage" aria-label="Juego Río Aventura">
    <canvas id="game" width="450" height="800"></canvas>
    <div id="hud"><span id="score">0 puntos</span><span id="lives">♥ ♥ ♥</span><button id="pause" type="button" aria-label="Pausar">Ⅱ</button></div>
    <div id="overlay"><h1 id="title">Río<br>Aventura</h1><p id="message">Esquiva las rocas y llega lo más lejos posible. Mantén pulsado a la izquierda o derecha para remar.</p><button id="play" type="button">¡Jugar!</button></div>
    <div id="hint">← Mantén pulsado para remar →</div>
  </main>
  <script src="game.js"></script>
</body>
</html>
